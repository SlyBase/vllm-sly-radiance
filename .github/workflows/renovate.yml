# Self-hosted Renovate, same setup as SlyBase/helm-charts: renovate.json has tracked every pin of
# this repo (Dockerfile ARGs, base images, libr4d, CI tools, actions, constraints.txt) since the
# start, but nothing ever ran it. The token is the upstream-sync GitHub App's (SYNC_APP_*), which
# needs contents, pull requests, issues (dependency dashboard) and workflows (action bumps) write.
#
# Renovate PRs run ci.yml like any PR; the `constraints` job there is what makes a
# constraints.txt bump safe to merge. They never build the image (build.yml needs a VERSION bump
# on main) and never deploy.
name: renovate

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths: [renovate.json, .github/workflows/renovate.yml, .github/renovate-entrypoint.sh]
  workflow_dispatch:
    inputs:
      log_level:
        description: Renovate LOG_LEVEL
        type: choice
        options: [info, debug]
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    # pause switch of the automated maintenance (docs/MAINTENANCE.md): repo variable AUTO_MAINTAIN=off
    if: vars.AUTO_MAINTAIN != 'off'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # docker-cmd-file below is bind-mounted from the workspace; without a checkout docker creates
      # an empty directory there and the image entrypoint hands "/renovate-entrypoint.sh" to
      # Renovate as a repository name (platform-unknown-error).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/create-github-app-token@v3
        id: app_token
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          token: ${{ steps.app_token.outputs.token }}
          # postUpgradeTasks (ci/resolve_stack.py --apply) need python3 (+ venv/pip for
          # check_constraints.py --update) inside Renovate's container: the entrypoint installs it
          # as root and drops to Renovate's user.
          docker-user: root
          docker-cmd-file: .github/renovate-entrypoint.sh
        env:
          # the one command renovate.json's postUpgradeTasks may run (anchored regex, exact string)
          RENOVATE_ALLOWED_POST_UPGRADE_COMMANDS: '["^python3 ci/resolve_stack\\.py --apply$"]'
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          # The installation token is scoped to this repository; lookups of other repositories'
          # releases/tags (pytorch, triton, vllm, aiter, actions) need a separate read-only token
          # or they run into the anonymous rate limit. Same secret name as in helm-charts.
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
