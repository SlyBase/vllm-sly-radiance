# Daily mirror of the two Codeberg upstreams into origin/upstream/<name> (fast-forward only) and
# a PR upstream/<name> -> main whenever the mirror has commits main does not. Nothing is merged
# automatically; the PR body lists the new commits, the test-merge conflict status, the
# ci/check_consistency.py result against that test merge, and the changed files that are part of
# the image build (ci/upstream_sync.sh).
#
# Token: a GitHub App installation token if secrets SYNC_APP_ID + SYNC_APP_PRIVATE_KEY are both
# set, else the default GITHUB_TOKEN. With the default token (a) PR creation needs the org/repo
# setting "Allow GitHub Actions to create and approve pull requests" and (b) the created PR does
# NOT trigger ci.yml (GitHub suppresses workflow runs for events caused by GITHUB_TOKEN) -- so set
# up the App. One-time, no PAT to ever rotate or expire early: GitHub -> Settings -> Developer
# settings -> GitHub Apps -> New GitHub App; repository permissions Contents R/W + Pull requests
# R/W; no webhook needed; install it on this repo; add its App ID as secret SYNC_APP_ID and the
# generated private key's .pem contents as secret SYNC_APP_PRIVATE_KEY.
#
# Semantic-overlap triage (does an upstream file already have a diverged sly/ or patch_*.py
# counterpart?) runs OUTSIDE this workflow: a Hermes webhook route (homelab repo,
# hermes-config.yaml.j2, route "upstream-sync-triage-slybase") fires on this repo's pull_request
# events against the self-hosted, cost-free vLLM instead of a paid Anthropic API. It posts at most
# one PR comment via GitHub REST with its own token, never pushes/merges, and never touches
# README.md -- this fork's README is intentionally never taken from upstream (see
# ci/upstream_sync.sh's README handling). There used to be a `triage` job here using
# anthropics/claude-code-action@v1; removed once the Hermes route replaced it (it never activated
# in Actions -- ANTHROPIC_API_KEY/CLAUDE_CODE_OAUTH_TOKEN were never set).
name: upstream-sync

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: stilldeadcode
            url: https://codeberg.org/StillDeadcode/vllm-radiance.git
          - name: ggz14
            url: https://codeberg.org/ggz14/radiance-vllm-mxfp4.git
    steps:
      - name: check for a GitHub App credential
        id: app_check
        env:
          HAS_APP_ID: ${{ secrets.SYNC_APP_ID != '' }}
          HAS_APP_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_APP_ID" = "true" ] && [ "$HAS_APP_KEY" = "true" ]; then
            echo "have_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_app=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@v2
        id: app_token
        if: ${{ steps.app_check.outputs.have_app == 'true' }}
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token || github.token }}

      - name: mirror ${{ matrix.name }} and open/refresh the PR
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          HAVE_APP_TOKEN: ${{ steps.app_token.outputs.token != '' }}
          NAME: ${{ matrix.name }}
          URL: ${{ matrix.url }}
        run: |
          git config user.name "upstream-sync[bot]"
          git config user.email "upstream-sync@users.noreply.github.com"
          if [ "$HAVE_APP_TOKEN" != "true" ]; then
            echo "::warning::SYNC_APP_ID/SYNC_APP_PRIVATE_KEY not set -- using GITHUB_TOKEN; PRs it creates will not trigger ci.yml"
          fi
          ci/upstream_sync.sh "$NAME" "$URL"
