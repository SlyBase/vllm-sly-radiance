# Daily mirror of the two Codeberg upstreams into origin/upstream/<name> (fast-forward only) and
# a PR upstream/<name> -> main whenever the mirror has commits main does not. Nothing is merged
# automatically; the PR body lists the new commits, the test-merge conflict status, the
# ci/check_consistency.py result against that test merge, the changed files that are part of the
# image build and their size-capped per-file diffs (ci/upstream_sync.sh).
#
# Token: a GitHub App installation token if secrets SYNC_APP_ID + SYNC_APP_PRIVATE_KEY are both
# set, else the default GITHUB_TOKEN. With the default token (a) PR creation needs the org/repo
# setting "Allow GitHub Actions to create and approve pull requests" and (b) the created PR does
# NOT trigger ci.yml (GitHub suppresses workflow runs for events caused by GITHUB_TOKEN) -- so set
# up the App. One-time, no PAT to ever rotate or expire early: GitHub -> Settings -> Developer
# settings -> GitHub Apps -> New GitHub App; repository permissions Contents R/W + Pull requests
# R/W; no webhook needed; install it on this repo; add its App ID as secret SYNC_APP_ID and the
# generated private key's .pem contents as secret SYNC_APP_PRIVATE_KEY.
#
# Semantic-overlap triage (does an upstream file already have a diverged sly/ or patch_*.py
# counterpart?) runs OUTSIDE this workflow: a Hermes webhook route (homelab repo,
# hermes-config.yaml.j2, route "upstream-sync-triage-slybase") against the self-hosted,
# cost-free vLLM instead of a paid Anthropic API. It posts at most one PR comment via GitHub
# REST with its own token, never pushes/merges, and never touches README.md -- this fork's
# README is intentionally never taken from upstream (see ci/upstream_sync.sh's README
# handling). There used to be a `triage` job here using anthropics/claude-code-action@v1;
# removed once the Hermes route replaced it (it never activated in Actions --
# ANTHROPIC_API_KEY/CLAUDE_CODE_OAUTH_TOKEN were never set).
#
# GitHub does NOT deliver repository webhooks for pull_request edits/creates made with a
# GitHub App installation token (verified empirically 2026-09-18: an identical gh pr edit
# fires a delivery under a user token but not under the SYNC_APP token this workflow normally
# runs with) -- so the "mirror" step below ("ping the Hermes triage webhook" step) posts a
# synthetic, HMAC-signed pull_request event to the Hermes route itself right after
# ci/upstream_sync.sh runs, instead of relying on GitHub to relay one. Needs repo secret
# HERMES_WEBHOOK_SECRET (same shared value as Hermes' platforms.webhook.extra.secret).
name: upstream-sync

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: stilldeadcode
            url: https://codeberg.org/StillDeadcode/vllm-radiance.git
          - name: ggz14
            url: https://codeberg.org/ggz14/radiance-vllm-mxfp4.git
    steps:
      - name: check for a GitHub App credential
        id: app_check
        env:
          HAS_APP_ID: ${{ secrets.SYNC_APP_ID != '' }}
          HAS_APP_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_APP_ID" = "true" ] && [ "$HAS_APP_KEY" = "true" ]; then
            echo "have_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_app=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@v2
        id: app_token
        if: ${{ steps.app_check.outputs.have_app == 'true' }}
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token || github.token }}

      - name: mirror ${{ matrix.name }} and open/refresh the PR
        id: mirror
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          HAVE_APP_TOKEN: ${{ steps.app_token.outputs.token != '' }}
          NAME: ${{ matrix.name }}
          URL: ${{ matrix.url }}
        run: |
          git config user.name "upstream-sync[bot]"
          git config user.email "upstream-sync@users.noreply.github.com"
          if [ "$HAVE_APP_TOKEN" != "true" ]; then
            echo "::warning::SYNC_APP_ID/SYNC_APP_PRIVATE_KEY not set -- using GITHUB_TOKEN; PRs it creates will not trigger ci.yml"
          fi
          ci/upstream_sync.sh "$NAME" "$URL"

      - name: ping the Hermes triage webhook (App-token PR edits/creates never reach GitHub's own webhook delivery)
        if: steps.mirror.outputs.pr_number != ''
        env:
          HERMES_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
          PR_NUMBER: ${{ steps.mirror.outputs.pr_number }}
          PR_ACTION: ${{ steps.mirror.outputs.pr_action }}
          HEAD_REF: upstream/${{ matrix.name }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          if [ -z "$HERMES_SECRET" ]; then
            echo "::warning::HERMES_WEBHOOK_SECRET not set -- skipping the Hermes triage ping"
            exit 0
          fi
          # nonce: unique per run and attempt, so the triage can append it to its GitHub API URLs
          # (?nonce=...) and get a fresh response instead of a stale web_extract cache entry.
          PAYLOAD=$(jq -n \
            --arg action "$PR_ACTION" \
            --arg repo "$REPO_FULL_NAME" \
            --argjson number "$PR_NUMBER" \
            --arg html_url "https://github.com/$REPO_FULL_NAME/pull/$PR_NUMBER" \
            --arg head_ref "$HEAD_REF" \
            --arg nonce "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            '{action: $action, repository: {full_name: $repo},
              pull_request: {number: $number, html_url: $html_url, nonce: $nonce,
                head: {ref: $head_ref}, base: {ref: "main"},
                labels: [{name: "upstream-sync"}]}}')
          SIG=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$HERMES_SECRET" | sed 's/^.* //')
          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: pull_request" \
            -H "X-Hub-Signature-256: sha256=$SIG" \
            -d "$PAYLOAD" \
            https://hooks.timonds.de/webhooks/upstream-sync-triage-slybase
