# GPU acceptance gate: does this image still behave like production?
#
# There is exactly one R9700 (LXC 2408) and it runs the production vllm7. This workflow
# therefore never starts anything itself: it runs on the CPU-only CI LXC (label gpu-accept)
# and asks the restricted `gpu-window` helper in 2408 over SSH to hand the GPU over for a
# measurement window and to give it back afterwards (Betriebsregel Nr. 1).
#
# Because the window takes production down for 20-30 minutes, the job sits in the protected
# environment `gpu-window`: GitHub waits for a human approval before the runner does anything.
# `gpu-window acquire` additionally refuses a window while the server is actually serving
# (running/waiting requests or recent POST /v1/ lines) unless it is forced.
#
# Triggers
#   - build.yml finished successfully on main           -> queued automatically, waits for approval
#     ONLY while AUTO_MAINTAIN=off; with the automated maintenance on, accept-night.yml gates + releases
#     (not for a v* tag: a tag only publishes to ghcr and points at a commit that main already
#     gated; an old tag can even predate ci/accept/ and would fail at the checkout)
#   - workflow_dispatch                                 -> choose image, profile, mode by hand
#
# Mode: `release` (~10 min per profile after health: hooks, greedy vs the last release, decode, prefill,
# concurrency 1/2/4/8, drafter floor, GSM8K-50) runs for every build and gates the tag, for BOTH profiles
# (vllm7-mxfp4 = Qwen, inkling), one GPU window each, one approval each. `quick` is the same without 8 streams
# and GSM8K (~5 min, PR images, never tags). `full` is the long BetterBench/GSM8K gate, optional and manual
# only. See ci/README.md ("GPU tiers").
#
# After the gate
#   green  -> the `release` job tags the gated commit v<VERSION> by itself (build.yml then publishes
#             every v* tag to ghcr.io); nothing to click
#   red    -> nothing is released. If a human decides the image is good anyway, release.yml
#             (Actions -> release -> Run workflow, reason required) cuts the same tag by hand.
name: accept

on:
  workflow_run:
    workflows: [build]
    types: [completed]
  workflow_dispatch:
    inputs:
      image:
        description: "image tag to test (empty = vllm-sly-radiance:<VERSION>-rocm<mm>)"
        type: string
        default: ""
      profile:
        description: profile
        type: choice
        options: [both, vllm7-mxfp4, inkling, vllm5-int4, vllm7-kv4]
        default: both
      mode:
        description: gate scope
        type: choice
        options: [release, quick, full]
        default: release
      force:
        description: take the GPU even if production saw recent traffic
        type: boolean
        default: false
      record_baseline:
        description: "calibration run: write the measured values into the baseline file"
        type: boolean
        default: false

permissions:
  contents: read

# One GPU, one window. Never cancel a running gate -- it has to reach its release step.
concurrency:
  group: gpu-window
  cancel-in-progress: false

jobs:
  plan:
    # Cheap, unprotected: decide what to test. No GPU, no runner from the homelab.
    # The automatic path after a main build runs only while the automated maintenance is paused
    # (AUTO_MAINTAIN=off): with it on, accept-night gates and releases, and a run here would sit in the
    # gpu-window environment waiting for an approval nobody gives -- holding the shared `gpu-window`
    # concurrency group, so every night gate behind it stays pending (seen 2026-10-07).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.AUTO_MAINTAIN == 'off' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-26.04
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      mode: ${{ steps.meta.outputs.mode }}
      profiles: ${{ steps.meta.outputs.profiles }}
      sha: ${{ steps.meta.outputs.sha }}
      skip: ${{ steps.meta.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run runs against the default branch; check out the built commit instead
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: resolve image, version and mode
        id: meta
        env:
          IMAGE_INPUT: ${{ inputs.image }}
          MODE_INPUT: ${{ inputs.mode }}
          PROFILE_INPUT: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          VER=$(tr -d '[:space:]' < VERSION)
          eval "$(python3 ci/read_pins.py --shell)"
          ROCM_MM=$(echo "$ROCM_BASE" | sed -E 's/^[^:]+:([0-9]+\.[0-9]+)\..*/\1/')
          IMAGE=${IMAGE_INPUT:-vllm-sly-radiance:${VER}-rocm${ROCM_MM}}

          MODE=${MODE_INPUT:-release}
          # the release tier gates the tag for both profiles; every other run takes one
          P=${PROFILE_INPUT:-both}
          if [ "$MODE" = release ] && [ "$P" = both ]; then
            PROFILES='["vllm7-mxfp4","inkling"]'
          else
            [ "$P" = both ] && P=vllm7-mxfp4
            PROFILES="[\"$P\"]"
          fi
          echo "mode=$MODE profiles=$PROFILES"

          # accept-night.yml already gated and merged this commit (and dispatches the release): a
          # second, approval-gated gate for the same VERSION would only wait for a click forever
          SKIP=false
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ -n "$(git tag -l "v${VER}")" ] || git log -1 --format=%s | grep -q "night gate green"; then
              SKIP=true; echo "v${VER} is released or was gated by accept-night: nothing to do"
            fi
          fi

          {
            echo "skip=$SKIP"
            echo "image=$IMAGE"; echo "version=$VER"; echo "mode=$MODE"
            echo "profiles=$PROFILES"; echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

      - name: summary
        run: |
          {
            echo "### Acceptance gate queued"
            echo ""
            echo "- image: \`${{ steps.meta.outputs.image }}\`"
            echo "- profiles: \`${{ steps.meta.outputs.profiles }}\` · mode: \`${{ steps.meta.outputs.mode }}\`"
            echo "- commit: \`${{ steps.meta.outputs.sha }}\`"
            echo ""
            echo "Waiting for approval of the **gpu-window** environment — production vllm7"
            echo "goes down for the length of the window."
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    # The inkling leg starts its own container and stops/starts the prod unit (LocalDockerWindow), so it
    # runs on the GPU host (LXC 2408: docker, the model dirs); the Qwen leg drives the helper over SSH.
    runs-on: [self-hosted, linux, x64, rocm-build]
    # Both legs start their own container on the GPU host (LocalDockerWindow:
    # stop docker-vllm7, docker run on :8001, health, rm, start prod), so both
    # run on LXC 2408 where docker, systemctl and the model dirs live. The
    # helper lock is still taken over SSH (ACCEPT_SSH).
    # Protected: a reviewer has to approve before production is touched.
    environment: gpu-window
    timeout-minutes: 180
    permissions:
      contents: read
      statuses: write
    # one GPU: the legs run one after the other (a leg that fails does not stop the other one's report)
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.plan.outputs.profiles) }}
    steps:
      - name: clean workspace (root-owned files of an earlier job break the checkout)
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete 2>/dev/null \
            || docker run --rm -v "$GITHUB_WORKSPACE:/w" busybox find /w -mindepth 1 -delete \
            || echo "::warning::could not clean $GITHUB_WORKSPACE"

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: gpu-window status
        env:
          ACCEPT_SSH: ${{ vars.ACCEPT_SSH || 'gpuwin@192.168.178.51' }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=ci/accept/known_hosts "$ACCEPT_SSH" status

      - name: run gate
        id: gate
        env:
          ACCEPT_HOST: ${{ vars.ACCEPT_HOST || '192.168.178.51' }}
          ACCEPT_SSH: ${{ vars.ACCEPT_SSH || 'gpuwin@192.168.178.51' }}
          ACCEPT_BB_PYTHON: /opt/accept/venv/bin/python
          ACCEPT_BB_DIR: /opt/accept/betterbench
          ACCEPT_EVAL_PYTHON: /opt/accept/venv/bin/python
          # inkling leg only (local container): host paths of the checkpoint, the drafter and the compile cache
          ACCEPT_INKLING_MODEL: ${{ vars.ACCEPT_INKLING_MODEL || '/root/inkling2-mini' }}
          ACCEPT_INKLING_DRAFTER: ${{ vars.ACCEPT_INKLING_DRAFTER || '/root/dflash2-ink/model' }}
          ACCEPT_INKLING_CACHE: ${{ vars.ACCEPT_INKLING_CACHE || '/root/accept-inkling-cache' }}
          # Qwen leg (local-docker too): checkpoint and compile-cache dirs of the
          # homelab swift-mxfp4 profile (lxc_vllm7.yml).
          ACCEPT_QWEN_MODEL: ${{ vars.ACCEPT_QWEN_MODEL || '/root/mcb-ckpt-v2' }}
          ACCEPT_QWEN_CACHE: ${{ vars.ACCEPT_QWEN_CACHE || '/root/vllm7-cache' }}
        run: |
          set -o pipefail
          python3 ci/accept/accept.py \
            --profile "ci/accept/profiles/${{ matrix.profile }}.json" \
            --image "${{ needs.plan.outputs.image }}" \
            --mode "${{ needs.plan.outputs.mode }}" \
            --owner "gh-${{ github.run_id }}" \
            --out "out/accept-${{ needs.plan.outputs.version }}-${{ needs.plan.outputs.mode }}-${{ matrix.profile }}" \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.record_baseline && '--record-baseline' || '' }}

      - name: upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accept-${{ needs.plan.outputs.version }}-${{ needs.plan.outputs.mode }}-${{ matrix.profile }}
          path: out/accept-*/
          retention-days: 30

      - name: release-tier status on the gated commit
        # release.yml and the release job read these two contexts (ci/quick_bench.py release-check)
        if: always() && needs.plan.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          GATE: ${{ steps.gate.outcome }}
          PROFILE: ${{ matrix.profile }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STATE=failure; [ "$GATE" = success ] && STATE=success
          # curl, not gh: the rocm-build runner has no gh
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"release-tier/$PROFILE\",\"target_url\":\"$RUN_URL\",\"description\":\"release tier: image ${{ needs.plan.outputs.image }}\"}"

      - name: production health (independent of the gate result)
        if: always()
        env:
          # production is vllm7 on LXC 2408 (docker-vllm7.service) since 2026-10-24; Radiance on LXC 2413
          # (http://192.168.178.54:8000/health) is off -- set the variable to that if it is production again
          PROD_HEALTH_URL: ${{ vars.PROD_HEALTH_URL || 'http://192.168.178.51:8000/health' }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$PROD_HEALTH_URL" || echo 000)
          echo "production /health = $code"
          test "$code" = "200"

      - name: baseline diff
        if: always() && inputs.record_baseline
        run: git --no-pager diff -- ci/accept/baselines/ || true

  release:
    # A green gate is the release: an annotated tag v<VERSION> on the commit that was gated. Only for
    # what the gate is about -- the main build of VERSION, or a by-hand run of the production profile
    # with the default image on main; never a calibration run (record_baseline) or another profile.
    # `needs` makes this job skip when the gate is red, cancelled or was skipped.
    needs: [plan, gate]
    if: >-
      github.event_name == 'workflow_run' ||
      (github.ref == 'refs/heads/main' && inputs.image == '' && inputs.profile == 'both' &&
       !inputs.record_baseline && inputs.mode == 'release')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      statuses: read
    steps:
      # The App token, not GITHUB_TOKEN: a tag pushed with the latter does not start build.yml.
      - uses: actions/create-github-app-token@v3
        id: app_token
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: both release-tier statuses are green on this commit
        id: tier
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          SKIP: 'false'
        run: |
          # release-tier/vllm7-mxfp4 + release-tier/inkling, set by accept.yml (ci/README.md, "GPU tiers")
          STATUSES=$(gh api "repos/${{ github.repository }}/commits/$SHA/status" \
            --jq '[.statuses[] | {(.context): .state}] | add // {}')
          if echo "$STATUSES" | python3 ci/quick_bench.py release-check; then
            echo "tier=green" >> "$GITHUB_OUTPUT"
          elif [ "$SKIP" = "true" ]; then
            echo "::warning::release tier not green, tagging anyway (skip_tier_check)"
            echo "tier=skipped" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

      - name: tag the gated commit
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
          IMAGE: ${{ needs.plan.outputs.image }}
          MODE: ${{ needs.plan.outputs.mode }}
          PROFILE: ${{ needs.plan.outputs.profiles }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_NOTIFY: ${{ vars.RELEASE_NOTIFY || '@slydlake' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ci/release_tag.sh "$VERSION" "$SHA" \
            "acceptance gate passed: ${IMAGE}, profile ${PROFILE}, mode ${MODE}" "$RUN_URL"
          {
            echo "### Released v${VERSION}"
            echo ""
            echo "The gate was green, so \`v${VERSION}\` was tagged on \`${SHA}\`;"
            echo "the tag starts **build**, which publishes the image to ghcr.io."
          } >> "$GITHUB_STEP_SUMMARY"
