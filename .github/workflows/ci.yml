# CI for every pull request and every push to main: lint, a GPU-less dry run of the Dockerfile's
# patch loop against the pinned upstream sources, and consistency checks between the loop, the
# patch files and the docs. No image build here -- that is build.yml on the self-hosted ROCm
# runner, triggered by a VERSION bump on main or a v* tag, never by a PR.
#
# The aggregate job `ci` is the status check the branch protection on main requires.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=pypi depName=ruff
  RUFF_VERSION: 0.17.0
  # renovate: datasource=docker depName=hadolint/hadolint
  HADOLINT_VERSION: v2.15.1
  # renovate: datasource=docker depName=rhysd/actionlint
  ACTIONLINT_VERSION: 1.7.12

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: ruff (syntax / undefined-name classes only)
        run: |
          pipx run "ruff==${RUFF_VERSION}" check --select E9,F63,F7,F82 --output-format github .

      - name: shellcheck (severity error)
        run: |
          shellcheck --version | head -2
          # shellcheck disable=SC2046
          shellcheck -S error $(git ls-files '*.sh')

      - name: hadolint
        run: |
          docker run --rm -i -v "$PWD/.hadolint.yaml:/.hadolint.yaml:ro" \
            "hadolint/hadolint:${HADOLINT_VERSION}" hadolint --config /.hadolint.yaml - < Dockerfile

      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo "rhysd/actionlint:${ACTIONLINT_VERSION}" -color

      - name: docker buildx build --check
        run: docker buildx build --check .

  patch-dryrun:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # same minor as the image's venv (Ubuntu 24.04 python 3.12)
          python-version: "3.12"

      - name: pins
        id: pins
        run: |
          python3 ci/read_pins.py
          echo "key=$(python3 ci/read_pins.py | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: cache pinned upstream source trees
        uses: actions/cache@v6
        with:
          path: .dryrun/src
          key: dryrun-src-${{ steps.pins.outputs.key }}

      - name: apply the Dockerfile patch loop twice (apply, then all-NOOP)
        run: ci/patch_dryrun.sh

      - name: aiter contract vs the pinned tag (AST, CPU-only)
        # the dry-run already checked out aiter/ at the pinned tag -- this reuses it: the
        # radiance_attn_decode surface (_UAParams fields, use_2d_kernel, get_unified_attention_config)
        # must survive the bump BEFORE the merge, not in the GPU accept gate after it.
        # GH_PR_BODY + GH_PR_COMMENTS let the drift check demand a justification when the pin
        # runs 2+ releases above vLLM's sanctioned AITER_BRANCH (e.g. 0.1.24 over 0.1.21.post2);
        # renovate PRs carry a template body, so justifications usually live in a comment.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin).get("body") or "")' > .pr_body
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments?per_page=100" \
              | python3 -c 'import sys,json; print("\n".join(c.get("body") or "" for c in json.load(sys.stdin)))' > .pr_comments
            GH_PR_BODY="$(cat .pr_body)" GH_PR_COMMENTS="$(cat .pr_comments)" \
              python3 ci/check_aiter_contract.py --aiter-src .dryrun/src/aiter
            rm -f .pr_body .pr_comments
          else
            python3 ci/check_aiter_contract.py --aiter-src .dryrun/src/aiter
          fi

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: patch-dryrun-logs
          path: .dryrun/pass*.log
          if-no-files-found: ignore

  constraints:
    # constraints.txt must be exactly what pip resolves for the pinned vLLM (no missing, stale or
    # out-of-range pin): the guard that makes a Renovate bump of it mergeable without an image build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # the persisted GITHUB_TOKEN (contents: read) is sent to github.com in front of the App
          # token in the repair push's URL and gets it a 403 as github-actions[bot]; the repo is
          # public, so the fetches below need no credentials
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          # the image's interpreter: pip evaluates environment markers for the running one
          python-version: "3.12"

      - name: replay the image's pip resolution against constraints.txt
        id: check
        # a Renovate PR gets repaired below instead of just failing
        continue-on-error: ${{ startsWith(github.head_ref, 'renovate/') }}
        run: python3 ci/check_constraints.py

      # Renovate looks packages up one by one, so its PR can hold versions that do not fit
      # together (see --repair in ci/check_constraints.py). Re-resolve the changed pins as ranges,
      # push the consistent set to the Renovate branch with the App token (a GITHUB_TOKEN push
      # would not start CI again) and fail this run; the push's own run is the one that counts.
      # Renovate sees the branch as edited from then on and leaves it alone until it is merged.
      - name: app token (repair)
        id: app_token
        if: steps.check.outcome == 'failure' && startsWith(github.head_ref, 'renovate/')
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - name: repair the Renovate PR
        if: steps.check.outcome == 'failure' && startsWith(github.head_ref, 'renovate/')
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF" "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          if [[ "$HEAD_REF" == renovate/stack-* ]]; then
            # a stack PR changes vLLM: re-resolve the whole file (what resolve_stack.py --apply does where
            # Renovate's container cannot, i.e. not on linux/python 3.12) instead of repairing single pins
            python3 ci/check_constraints.py --update | tee repair.log
          else
            python3 ci/check_constraints.py --repair --base "origin/$BASE_REF" | tee repair.log
          fi
          python3 ci/check_constraints.py
          git config user.name "constraints-repair[bot]"
          git config user.email "constraints-repair@users.noreply.github.com"
          git add constraints.txt renovate.json
          git commit -m "constraints: repair the resolution of this update" \
            -m "$(grep -E '^  |^repair:' repair.log)"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$HEAD_REF"
          {
            echo "### constraints.txt repaired and pushed"
            echo '```'; cat repair.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::constraints.txt did not resolve as proposed; the repaired set was pushed, its CI run decides"
          exit 1

  consistency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: patch loop vs. files vs. docs (+ VERSION bump on PRs)
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$BASE_REF" ] && [[ "$HEAD_REF" != upstream/* ]] && [[ "$HEAD_REF" != renovate/* ]]; then
            # upstream/* sync PRs are exempt: they never carry a VERSION bump until the merge is curated;
            # renovate/* likewise: dependency bumps collect on main and ship with the next VERSION bump
            python3 ci/check_consistency.py --base "origin/$BASE_REF"
          else
            python3 ci/check_consistency.py
          fi

  resolve:
    # The Dockerfile's torch/triton/torchvision/aiter/transformers pins must be what the pinned vLLM
    # release and the ROCm base derive (ci/resolve_stack.py; deliberate deviations: ci/stack_overrides.json).
    # On a stack PR this is the "incompatible" check: no AMD wheel / unreadable vLLM pins = red = never merged.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: resolver unit tests (offline, recorded fixtures)
        run: python3 -m unittest discover -s ci/tests

      - name: Dockerfile pins vs the derived stack
        run: |
          # the stack PR additionally downloads AMD's triton wheel (~430 MB) to verify TRITON_SHA256
          if [[ "$HEAD_REF" == renovate/stack-* ]]; then EXTRA=--verify-hash; else EXTRA=; fi
          python3 ci/resolve_stack.py --check $EXTRA
        env:
          HEAD_REF: ${{ github.head_ref }}

  reanchor-brief:
    # A stack PR whose sly patches no longer apply to the new vLLM: hand it to the owner's Hermes agent
    # (signed webhook, brief = rules + failing hunks, docs/MAINTENANCE.md). Hermes pushes fixes to the
    # PR branch, CI re-runs, and a new head sha may call it again. At most once per head sha.
    needs: [patch-dryrun]
    if: >-
      always() && needs.patch-dryrun.result == 'failure' && github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'renovate/stack-') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AUTO_MAINTAIN != 'off'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: patch-dryrun-logs
          path: .dryrun

      - name: signed webhook to Hermes (once per head sha)
        env:
          GH_TOKEN: ${{ github.token }}
          HERMES_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -z "$HERMES_SECRET" ]; then
            echo "::warning::HERMES_WEBHOOK_SECRET not set -- skipping the Hermes re-anchor call; a human has to fix the patches"
            exit 0
          fi
          MARKER="<!-- stack-patch-reanchor sha=${HEAD_SHA} -->"
          if gh api --paginate "repos/${REPO}/issues/${PR}/comments" --jq '.[].body' | grep -qF "$MARKER"; then
            echo "Hermes was already called for ${HEAD_SHA}: not again"
            exit 0
          fi
          PAYLOAD_FILE=$(mktemp)
          python3 ci/build_brief.py --repo "$REPO" --pr "$PR" --url "$PR_URL" --ref "$HEAD_REF" \
            --sha "$HEAD_SHA" --base "origin/${BASE_REF}" --logs .dryrun > "$PAYLOAD_FILE"
          # same signing as upstream-sync.yml: HMAC-SHA256 over the exact bytes, --data-binary
          SIG=$(openssl dgst -sha256 -hmac "$HERMES_SECRET" < "$PAYLOAD_FILE" | sed 's/^.* //')
          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: stack_patch_broken" \
            -H "X-Hub-Signature-256: sha256=$SIG" \
            --data-binary @"$PAYLOAD_FILE" \
            https://hooks.timonds.de/webhooks/stack-patch-reanchor-slybase
          gh pr comment "$PR" --repo "$REPO" --body "${MARKER}
          The sly patches no longer apply to this stack (\`ci/patch_dryrun.sh\` is red). The Hermes re-anchor agent was called for head \`${HEAD_SHA:0:12}\`; it pushes fixes to this branch or comments \`needs human\`. See docs/MAINTENANCE.md."

  ci:
    # aggregate status for the branch protection: one required check instead of five
    needs: [lint, patch-dryrun, constraints, consistency, resolve]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: all jobs succeeded?
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq 'failure|cancelled|skipped'; then
            echo "::error::a required job did not succeed"; exit 1
          fi
