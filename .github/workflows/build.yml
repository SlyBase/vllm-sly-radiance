# Image build on the self-hosted ROCm runner (LXC 2408, label rocm-build). CPU-only: docker
# build + an import smoke test without --device. The runner shares the LXC with the production
# vllm7 container, so this workflow never starts a GPU container and never deploys (that stays
# with Ansible + systemctl, see the homelab repo).
#
# Triggers:
#   - a VERSION bump on main or a v* tag (the production build: a main-branch build is a build
#     check, nothing more);
#   - pull_request -- but ONLY for PRs from this repo's own branches (the head_repo == repo
#     check): a PR from a fork must not reach the self-hosted runner (its code would execute
#     on it). Own-branch PRs (the renovate/* trio PRs, feature branches) are the classic
#     case where a build catches a compile-level break BEFORE the merge, at CPU-only cost
#     instead of after it;
#   - manual dispatch.
#
# Pushes the image to ghcr.io only for tags or when asked (push_ghcr); a PR or a
# main-branch build never publishes -- the `if:` guards on the push step enforce it.
# The one exception is build-internal: any build may push the torch wheel image
# (ghcr.io/slybase/vllm-sly-radiance-torch:<ci/torch_key.py>) when its key is not there yet --
# a wheel, not a runnable image, so nothing that could be mistaken for a release.
name: build

on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ["v*"]
  pull_request:
    # only when the image's pins can have moved (the trio bump PRs); a pure ci/ or docs PR
    # would burn hours of runner time for a build that cannot change anything
    paths: [Dockerfile]
  workflow_dispatch:
    inputs:
      push_ghcr:
        description: push the image to ghcr.io/slybase/vllm-sly-radiance
        type: boolean
        default: false
      rocm_base:
        description: override ARG ROCM_BASE (empty = Dockerfile default)
        type: string
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  image:
    # never for a PR from a fork (its code would execute on the self-hosted runner); own-
    # branch PRs are the build-check use case (a compile break before the merge, CPU-only).
    # For a fork PR, head.repo.full_name is the fork's full name -> != -> skipped; for an
    # own-branch PR it equals github.repository -> runs. Only evaluated when the trigger is a
    # pull_request (the left side short-circuits every other event).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, rocm-build]
    timeout-minutes: 300
    env:
      REGISTRY_IMAGE: ghcr.io/slybase/vllm-sly-radiance
    steps:
      - uses: actions/checkout@v7

      - name: resolve version, ROCm base and tag
        id: meta
        env:
          ROCM_BASE_INPUT: ${{ inputs.rocm_base }}
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          eval "$(python3 ci/read_pins.py --shell)"
          ROCM_BASE=${ROCM_BASE_INPUT:-$ROCM_BASE}
          # rocm/dev-ubuntu-24.04:10.0.0-full@sha256:... -> rocm10.0
          ROCM_MM=$(echo "$ROCM_BASE" | sed -E 's/^[^:]+:([0-9]+\.[0-9]+)\..*/\1/')
          TAG="vllm-sly-radiance:${VER}-rocm${ROCM_MM}"
          TORCH_REMOTE="${REGISTRY_IMAGE}-torch:$(python3 ci/torch_key.py --rocm-base "$ROCM_BASE")"
          {
            echo "version=$VER"; echo "rocm_base=$ROCM_BASE"; echo "tag=$TAG"
            echo "remote_tag=${REGISTRY_IMAGE}:${VER}-rocm${ROCM_MM}"
            echo "torch_remote=$TORCH_REMOTE"
          } >> "$GITHUB_OUTPUT"
          echo "building $TAG from $ROCM_BASE, torch wheel $TORCH_REMOTE"
          docker version --format 'docker {{.Server.Version}}'
          df -h /var/lib/docker | tail -1

      # Every build logs in: the torch wheel image is read (and, once per key, written) by PR
      # and main builds too, not only by the publishing ones.
      - name: login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # torch takes ~2 h to compile here and changes only with a torch bump, so it lives in its
      # own image (Dockerfile target torch-wheel, tag from ci/torch_key.py) instead of only in the
      # runner's BuildKit cache, which a full disk or a prune wipes. Present -> TORCH_FROM points at
      # it and the build never enters torch-build. Missing -> compile it once (a still-cached torch
      # layer makes that a cache hit) and push it; a failed push only costs the next build the same.
      - name: torch wheel (ghcr.io or compile once)
        id: torch
        env:
          ROCM_BASE: ${{ steps.meta.outputs.rocm_base }}
          TORCH_REMOTE: ${{ steps.meta.outputs.torch_remote }}
        run: |
          set -o pipefail
          if docker buildx imagetools inspect "$TORCH_REMOTE" >/dev/null 2>&1; then
            echo "torch wheel: $TORCH_REMOTE (from ghcr.io)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "from=$TORCH_REMOTE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "torch wheel $TORCH_REMOTE not on ghcr.io yet -> torch-wheel target"
          DOCKER_BUILDKIT=1 docker build --progress=plain --target torch-wheel \
            --build-arg "ROCM_BASE=${ROCM_BASE}" \
            -t "$TORCH_REMOTE" . 2>&1 | tee torch-build.log
          if docker push "$TORCH_REMOTE"; then
            echo "torch wheel: built and pushed $TORCH_REMOTE" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "from=$TORCH_REMOTE" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::push of $TORCH_REMOTE failed; this build uses the local torch-wheel stage"
            echo "from=torch-wheel" >> "$GITHUB_OUTPUT"
          fi

      - name: docker build
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          ROCM_BASE: ${{ steps.meta.outputs.rocm_base }}
          VER: ${{ steps.meta.outputs.version }}
          TORCH_FROM: ${{ steps.torch.outputs.from }}
        run: |
          set -o pipefail
          DOCKER_BUILDKIT=1 docker build --progress=plain \
            --build-arg "ROCM_BASE=${ROCM_BASE}" \
            --build-arg "TORCH_FROM=${TORCH_FROM}" \
            --build-arg "RADIANCE_VERSION=${VER}" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$TAG" . 2>&1 | tee build.log
          docker image inspect "$TAG" --format 'size {{.Size}} id {{.Id}}'
          # the venv split (Dockerfile stage venvsplit): the cold layer should repeat across releases
          grep -E '\[split_venv\] (cold|hot|  )' build.log || true
          docker history --format '{{.Size}}\t{{.CreatedBy}}' "$TAG" | grep -E 'COPY /(opt|split)' || true

      - name: smoke test (CPU only, no --device)
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VER: ${{ steps.meta.outputs.version }}
        run: |
          docker run --rm --entrypoint python3 "$TAG" -c "
          import vllm, radiance_mxfp4, radiance_fused_norm, radiance_lmhead_int4
          from vllm.model_executor.layers.quantization.quark.quark import QuarkConfig
          v = open('/opt/radiance_version').read().strip()
          assert v == '$VER', f'/opt/radiance_version {v} != VERSION $VER'
          print('vllm', vllm.__version__, 'image', v, 'QuarkConfig', QuarkConfig.__name__)
          " 2>&1 | tail -5
          LV=$(docker image inspect "$TAG" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          [ "$LV" = "$VER" ] || { echo "::error::label org.opencontainers.image.version is '$LV', not $VER"; exit 1; }

      - name: push to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v') || inputs.push_ghcr
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REMOTE: ${{ steps.meta.outputs.remote_tag }}
        run: |
          docker tag "$TAG" "$REMOTE"
          docker push "$REMOTE"
          # Registry-side OCI annotations (ghcr.io shows the index's description and links the
          # package to its repo by source). `docker build --annotation` is dropped by the docker
          # image-store exporter, so they are added here: imagetools re-creates the index around
          # the same manifests with the annotations, no layer is uploaded again.
          label() { docker image inspect "$TAG" --format "{{index .Config.Labels \"$1\"}}"; }
          ANN=()
          for k in title description version revision created source url documentation vendor; do
            ANN+=(--annotation "index:org.opencontainers.image.$k=$(label "org.opencontainers.image.$k")")
          done
          docker buildx imagetools create "${ANN[@]}" -t "$REMOTE" "$REMOTE"
          echo "pushed $REMOTE" >> "$GITHUB_STEP_SUMMARY"

      - name: summary
        if: always()
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          ROCM_BASE: ${{ steps.meta.outputs.rocm_base }}
        run: |
          {
            echo "- image: \`$TAG\`"
            echo "- base: \`$ROCM_BASE\`"
            echo "- runner: $(hostname), $(docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -c vllm-sly-radiance) local vllm-sly-radiance images"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ steps.meta.outputs.version }}
          path: |
            build.log
            torch-build.log
          if-no-files-found: ignore

      - name: prune dangling images
        if: always()
        run: docker image prune -f >/dev/null || true
