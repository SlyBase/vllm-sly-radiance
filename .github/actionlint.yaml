self-hosted-runner:
  # LXC 2408 (pve3): GitHub Actions runner "lxc2408-rocm", CPU-only docker builds, see build.yml
  # LXC 2412 (pve3): runner "lxc2412-accept", CPU-only, drives the GPU window in 2408 over SSH,
  #                  see accept.yml
  labels:
    - rocm-build
    - gpu-accept
    # ubuntu-26.04: current GitHub-hosted runner image (used in `runs-on:` across the workflows).
    # Registered here because the pinned actionlint does not yet ship it in its built-in label list;
    # actionlint treats this list as the set of known labels, which silences the "unknown label"
    # false positive without weakening the check for genuinely unknown labels.
    - ubuntu-26.04
